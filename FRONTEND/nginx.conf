# Static SPA + /api reverse proxy for the production frontend image.
# "backend" is the compose service name; for non-compose deploys, edit the
# upstream server line to the FastAPI origin and rebuild.
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA deep links (e.g. /products, /chat) all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + docs go to the FastAPI service (keeps auth cookies same-origin).
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend;
    }
}
